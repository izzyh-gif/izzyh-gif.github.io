<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Finder</title>

  <!--
    ============================================================
    OVERARCHING PROMPT / UI CONFIGURATION
    ============================================================
    Edit the values below to change the app's personality,
    placeholder text, suggested questions, and visual title.
    The actual AI instructions live in SYSTEM_PROMPT in app.py.
    ============================================================
  -->
  <script>
    const UI_CONFIG = {
      PAGE_TITLE:    "Hospital Finder",
      SUBTITLE:      "Ask about hospitals and patient-reported outcomes for hip & knee replacements",
      PLACEHOLDER:   "e.g. Find hospitals in Boston, MA with good hip replacement scores",
      WELCOME_MSG:   "Hi! I can help you find hospitals and explore patient-reported outcome scores for hip and knee replacement surgeries. Try asking about a specific city, state, ZIP code, or hospital name.",
      SUGGESTIONS: [
        "Find hospitals in California with hip replacement data",
        "Which hospitals in Texas have the best knee replacement scores?",
        "Show me hospitals near ZIP code 10001",
        "What does the THA/TKA score mean?",
      ],
    };
  </script>
  <!--
    ============================================================
    END UI CONFIGURATION
    ============================================================
  -->

  <style>
    /* ---- Design tokens ---- */
    :root {
      --blue-dark:   #003087;
      --blue-mid:    #0057b8;
      --blue-light:  #d6e8ff;
      --blue-accent: #00a0d2;
      --white:       #ffffff;
      --gray-50:     #f4f7fb;
      --gray-100:    #e8edf5;
      --gray-300:    #c5d0de;
      --gray-400:    #8899aa;
      --gray-700:    #334155;
      --red:         #c0392b;
      --font:        'Segoe UI', Arial, sans-serif;
      --radius:      10px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.1);
      --shadow-md:   0 4px 16px rgba(0,0,0,.12);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--gray-50);
      color: var(--gray-700);
    }

    /* ---- Layout ---- */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 860px;
      margin: 0 auto;
    }

    /* ---- Header ---- */
    header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue-mid) 100%);
      color: var(--white);
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }
    .header-icon {
      font-size: 1.8rem;
      line-height: 1;
    }
    .header-text h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -.3px;
    }
    .header-text p {
      font-size: .78rem;
      opacity: .8;
      margin-top: .15rem;
    }
    .cms-badge {
      margin-left: auto;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 20px;
      padding: .25rem .75rem;
      font-size: .7rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ---- Chat window ---- */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    /* ---- Message bubbles ---- */
    .message {
      display: flex;
      gap: .65rem;
      align-items: flex-start;
      max-width: 88%;
      animation: fadeUp .2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .message.user  { align-self: flex-end; flex-direction: row-reverse; }
    .message.assistant { align-self: flex-start; }

    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .95rem;
      flex-shrink: 0;
      margin-top: .1rem;
    }
    .message.user      .avatar { background: var(--blue-mid);  color: var(--white); }
    .message.assistant .avatar { background: var(--blue-light); color: var(--blue-dark); }

    .bubble {
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: .92rem;
      line-height: 1.6;
      box-shadow: var(--shadow-sm);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user      .bubble {
      background: var(--blue-mid);
      color: var(--white);
      border-bottom-right-radius: 3px;
    }
    .message.assistant .bubble {
      background: var(--white);
      color: var(--gray-700);
      border: 1px solid var(--gray-100);
      border-bottom-left-radius: 3px;
    }

    /* ---- Typing indicator ---- */
    .typing .bubble {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: .75rem .9rem;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--blue-accent);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    /* ---- Error bubble ---- */
    .bubble.error {
      background: #fde8e8;
      color: var(--red);
      border-color: #f5c6c6;
    }

    /* ---- Suggestions ---- */
    .suggestions {
      padding: 0 1rem .5rem;
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      flex-shrink: 0;
    }
    .suggestions p {
      width: 100%;
      font-size: .75rem;
      color: var(--gray-400);
      margin-bottom: .1rem;
    }
    .suggestion-btn {
      background: var(--white);
      border: 1.5px solid var(--blue-light);
      color: var(--blue-mid);
      border-radius: 20px;
      padding: .3rem .85rem;
      font-size: .8rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .suggestion-btn:hover {
      background: var(--blue-light);
      border-color: var(--blue-mid);
    }

    /* ---- Input bar ---- */
    .input-bar {
      display: flex;
      gap: .6rem;
      padding: .85rem 1rem;
      border-top: 1px solid var(--gray-100);
      background: var(--white);
      flex-shrink: 0;
    }
    #user-input {
      flex: 1;
      border: 1.5px solid var(--gray-300);
      border-radius: var(--radius);
      padding: .65rem .95rem;
      font-size: .95rem;
      font-family: var(--font);
      outline: none;
      resize: none;
      line-height: 1.5;
      max-height: 120px;
      overflow-y: auto;
      transition: border-color .15s, box-shadow .15s;
    }
    #user-input:focus {
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 3px rgba(0,87,184,.1);
    }
    #send-btn {
      background: var(--blue-mid);
      color: var(--white);
      border: none;
      border-radius: var(--radius);
      padding: .65rem 1.1rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #send-btn:hover   { background: var(--blue-dark); }
    #send-btn:active  { transform: scale(.95); }
    #send-btn:disabled {
      background: var(--gray-300);
      cursor: not-allowed;
    }

    /* ---- Footer ---- */
    footer {
      text-align: center;
      font-size: .72rem;
      color: var(--gray-400);
      padding: .4rem;
      background: var(--white);
      border-top: 1px solid var(--gray-100);
      flex-shrink: 0;
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      .cms-badge { display: none; }
      .header-text p { display: none; }
      .message { max-width: 96%; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="header-icon" aria-hidden="true">🏥</div>
    <div class="header-text">
      <h1 id="page-title">Hospital Finder</h1>
      <p id="page-subtitle"></p>
    </div>
    <span class="cms-badge">CMS Patient-Reported Outcomes Data</span>
  </header>

  <!-- Chat messages -->
  <div class="chat-window" id="chat-window" role="log" aria-live="polite" aria-label="Chat conversation"></div>

  <!-- Suggested questions (hidden after first user message) -->
  <div class="suggestions" id="suggestions">
    <p>Try asking:</p>
    <!-- populated by JS from UI_CONFIG.SUGGESTIONS -->
  </div>

  <!-- Input -->
  <div class="input-bar">
    <textarea
      id="user-input"
      rows="1"
      aria-label="Your message"
      autocomplete="off"
      spellcheck="true"
    ></textarea>
    <button id="send-btn" aria-label="Send message" title="Send (Enter)">&#9658;</button>
  </div>

  <footer>
    Data: CMS Provider Data Catalog — Patient-Reported Outcomes &nbsp;|&nbsp;
    AI responses may contain errors. Not medical advice.
  </footer>

</div>

<script>
  // ============================================================
  // STATE
  // ============================================================
  const history = [];   // [{role, content}, ...] — sent to /chat each turn
  let   waiting = false;

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("page-title").textContent   = UI_CONFIG.PAGE_TITLE;
    document.getElementById("page-subtitle").textContent = UI_CONFIG.SUBTITLE;
    document.getElementById("user-input").placeholder   = UI_CONFIG.PLACEHOLDER;
    document.title = UI_CONFIG.PAGE_TITLE;

    buildSuggestions();
    appendMessage("assistant", UI_CONFIG.WELCOME_MSG);

    // Send on Enter (Shift+Enter = newline)
    document.getElementById("user-input").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Auto-resize textarea
    document.getElementById("user-input").addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 120) + "px";
    });

    document.getElementById("send-btn").addEventListener("click", sendMessage);
  });

  // ============================================================
  // SUGGESTIONS
  // ============================================================
  function buildSuggestions() {
    const container = document.getElementById("suggestions");
    UI_CONFIG.SUGGESTIONS.forEach(text => {
      const btn = document.createElement("button");
      btn.className = "suggestion-btn";
      btn.textContent = text;
      btn.addEventListener("click", () => {
        document.getElementById("user-input").value = text;
        sendMessage();
      });
      container.appendChild(btn);
    });
  }

  function hideSuggestions() {
    document.getElementById("suggestions").style.display = "none";
  }

  // ============================================================
  // SEND MESSAGE
  // ============================================================
  async function sendMessage() {
    if (waiting) return;

    const input = document.getElementById("user-input");
    const text  = input.value.trim();
    if (!text) return;

    hideSuggestions();
    input.value = "";
    input.style.height = "auto";

    // Render user bubble
    appendMessage("user", text);
    history.push({ role: "user", content: text });

    // Show typing indicator
    const typingId = showTyping();
    setWaiting(true);

    try {
      const res = await fetch("/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({
          message: text,
          history: history.slice(0, -1),   // exclude the just-added user turn
        }),
      });

      const data = await res.json();
      removeTyping(typingId);

      if (!res.ok || data.error) {
        const errMsg = data.error || `Server error ${res.status}`;
        appendMessage("assistant", `⚠️ ${errMsg}`, true);
      } else {
        appendMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }

    } catch (err) {
      removeTyping(typingId);
      appendMessage("assistant", `⚠️ Could not reach the server: ${err.message}`, true);
    }

    setWaiting(false);
    input.focus();
  }

  // ============================================================
  // UI HELPERS
  // ============================================================
  function appendMessage(role, text, isError = false) {
    const window_ = document.getElementById("chat-window");

    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.textContent = role === "user" ? "👤" : "🏥";

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");
    bubble.textContent = text;   // textContent prevents XSS

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    window_.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function showTyping() {
    const id = "typing-" + Date.now();
    const window_ = document.getElementById("chat-window");

    const msg = document.createElement("div");
    msg.className = "message assistant typing";
    msg.id = id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.textContent = "🏥";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.setAttribute("aria-label", "Assistant is typing");
    [1,2,3].forEach(() => {
      const dot = document.createElement("span");
      dot.className = "dot";
      bubble.appendChild(dot);
    });

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    window_.appendChild(msg);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function setWaiting(state) {
    waiting = state;
    document.getElementById("send-btn").disabled = state;
    document.getElementById("user-input").disabled = state;
  }

  function scrollToBottom() {
    const w = document.getElementById("chat-window");
    w.scrollTop = w.scrollHeight;
  }
</script>
</body>
</html>
