<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    ============================================================
    OVERARCHING PROMPT / UI CONFIGURATION
    ============================================================
    Edit the values below to change the app's personality,
    placeholder text, suggested questions, and visual title.
    The actual AI instructions live in SYSTEM_PROMPT in app.py.
    ============================================================
  -->
  <script>
    // ============================================================
    // BACKEND URL CONFIGURATION
    // ============================================================
    // After deploying to Render, replace the empty string below
    // with your Render service URL, e.g.:
    //   const BACKEND_URL = "https://hospital-finder.onrender.com";
    //
    // Leave it as an empty string "" to use a relative /chat path,
    // which works when running locally via `python app.py`.
    // ============================================================
    const BACKEND_URL = "https://hospital-finder-sltg.onrender.com";

    const UI_CONFIG = {
      PAGE_TITLE:  "Hospital Cost Comparer",
      SUBTITLE:    "Search Medicare inpatient hospitals and compare procedure costs",
      PLACEHOLDER: "Ask about hospitals, procedures, or costs…",
      WELCOME_MSG: "Hi! I can help you find hospitals and compare their Medicare inpatient costs by procedure. Try asking about a specific city, state, ZIP code, hospital name, or procedure type. Note that information is limited to the CMS dataset I work on for accurate information!",
      SUGGESTIONS: [
        "Find hospitals in California that perform heart failure procedures",
        "Compare costs for hip replacement in Texas",
        "Show me hospitals near ZIP code 10001",
        "What is a DRG code?",
      ],
    };
  </script>
  <!--
    ============================================================
    END UI CONFIGURATION
    ============================================================
  -->

  <style>
    /* ============================================================
       DESIGN TOKENS
    ============================================================ */
    :root {
      --bg:           #f5f7fa;
      --surface:      #ffffff;
      --surface-2:    #f0f4f8;
      --surface-3:    #e4eaf1;
      --border:       rgba(0,0,0,.08);
      --border-focus: rgba(59,130,246,.45);

      --accent:       #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow:  rgba(59,130,246,.18);

      --text-primary:   #0f172a;
      --text-secondary: #475569;
      --text-muted:     #94a3b8;

      --user-bubble:    #2563eb;
      --user-text:      #ffffff;

      --red:   #ef4444;
      --green: #22c55e;

      --font:   'Inter', system-ui, sans-serif;
      --radius: 14px;
      --radius-sm: 8px;

      --shadow-glow: 0 0 0 3px var(--accent-glow);
      --shadow-card: 0 4px 24px rgba(0,0,0,.08);
    }

    /* ============================================================
       RESET & BASE
    ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 99px; }

    /* ============================================================
       APP SHELL
    ============================================================ */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
    }

    /* ============================================================
       HEADER
    ============================================================ */
    header {
      display: flex;
      align-items: center;
      gap: .85rem;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(59,130,246,.4);
    }

    .header-text { flex: 1; min-width: 0; }
    .header-text h1 {
      font-size: .975rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-text p {
      font-size: .72rem;
      color: var(--text-secondary);
      margin-top: .1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-badge {
      margin-left: auto;
      flex-shrink: 0;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .2rem .7rem;
      font-size: .68rem;
      color: var(--text-secondary);
      letter-spacing: .3px;
    }

    /* ============================================================
       CHAT WINDOW
    ============================================================ */
    .chat-window {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
    }

    /* ============================================================
       MESSAGES
    ============================================================ */
    .message {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      animation: fadeUp .18s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user      { flex-direction: row-reverse; }
    .message.assistant { flex-direction: row; }

    /* Avatar */
    .avatar {
      width: 30px; height: 30px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: .85rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.user .avatar {
      background: var(--user-bubble);
      font-size: .75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -.5px;
    }
    .message.assistant .avatar {
      background: linear-gradient(135deg, #1d4ed8, #3b82f6);
      box-shadow: 0 2px 6px rgba(59,130,246,.35);
    }

    /* Bubble wrapper */
    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: min(72%, 580px);
    }
    .message.user .bubble-wrap { align-items: flex-end; }

    /* Bubble */
    .bubble {
      padding: .75rem 1rem;
      border-radius: var(--radius);
      font-size: .9rem;
      line-height: 1.65;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .message.assistant .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }
    .bubble.error {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    /* ============================================================
       MARKDOWN STYLES (inside assistant bubble)
    ============================================================ */
    .bubble h1, .bubble h2, .bubble h3 {
      color: var(--text-primary);
      font-weight: 600;
      margin: .9rem 0 .35rem;
      line-height: 1.3;
    }
    .bubble h1 { font-size: 1.05rem; }
    .bubble h2 { font-size: .975rem; }
    .bubble h3 { font-size: .925rem; }
    .bubble p  { margin: .45rem 0; color: var(--text-primary); }
    .bubble p:first-child { margin-top: 0; }
    .bubble p:last-child  { margin-bottom: 0; }
    .bubble strong { font-weight: 600; color: #e2e8f0; }
    .bubble em     { font-style: italic; color: var(--text-secondary); }
    .bubble ul, .bubble ol {
      margin: .4rem 0 .4rem 1.2rem;
      color: var(--text-primary);
    }
    .bubble li { margin: .25rem 0; }
    .bubble code {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: .1rem .4rem;
      font-size: .82em;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      color: #1d4ed8;
    }
    .bubble pre {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .85rem 1rem;
      overflow-x: auto;
      margin: .6rem 0;
    }
    .bubble pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: .83rem;
    }
    .bubble hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: .7rem 0;
    }
    .bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: .85rem;
      color: var(--text-secondary);
      margin: .5rem 0;
    }
    .bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: .6rem 0;
      font-size: .84rem;
    }
    .bubble th, .bubble td {
      border: 1px solid var(--border);
      padding: .4rem .7rem;
      text-align: left;
    }
    .bubble th {
      background: var(--surface-3);
      color: #93c5fd;
      font-weight: 600;
    }
    .bubble tr:nth-child(even) td { background: var(--surface-2); }

    /* ============================================================
       SEE MORE / LESS
    ============================================================ */
    .bubble-content { overflow: hidden; }
    .bubble-content.collapsed { max-height: 200px; position: relative; }
    .bubble-content.collapsed::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 56px;
      background: linear-gradient(transparent, var(--surface));
      pointer-events: none;
    }
    .see-more-btn {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      margin-top: .5rem;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--accent);
      font-size: .78rem;
      font-family: var(--font);
      padding: .2rem .65rem;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .see-more-btn:hover {
      background: var(--surface-3);
      border-color: var(--accent);
    }

    /* ============================================================
       TYPING INDICATOR
    ============================================================ */
    .typing .bubble {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: .85rem 1rem;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-5px); }
    }

    /* ============================================================
       SUGGESTIONS
    ============================================================ */
    .suggestions {
      padding: .5rem 1.25rem .75rem;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      flex-shrink: 0;
    }
    .suggestions-label {
      width: 100%;
      font-size: .7rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: .1rem;
    }
    .suggestion-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      border-radius: 20px;
      padding: .35rem .85rem;
      font-size: .78rem;
      font-family: var(--font);
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
      white-space: nowrap;
    }
    .suggestion-btn:hover {
      background: var(--surface-3);
      border-color: var(--accent);
      color: var(--text-primary);
    }

    /* ============================================================
       INPUT BAR
    ============================================================ */
    .input-area {
      padding: .75rem 1.25rem 1rem;
      flex-shrink: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .input-box {
      display: flex;
      align-items: flex-end;
      gap: .6rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .6rem .6rem .6rem .9rem;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow);
    }
    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font);
      font-size: .9rem;
      line-height: 1.55;
      resize: none;
      max-height: 140px;
      overflow-y: auto;
      padding: .2rem 0;
    }
    #user-input::placeholder { color: var(--text-muted); }
    #user-input:disabled { opacity: .5; }

    #send-btn {
      width: 34px; height: 34px;
      background: var(--accent);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, transform .1s, opacity .15s;
    }
    #send-btn:hover   { background: var(--accent-hover); }
    #send-btn:active  { transform: scale(.93); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }

    .input-hint {
      text-align: center;
      font-size: .67rem;
      color: var(--text-muted);
      margin-top: .45rem;
    }

    /* ============================================================
       RESPONSIVE
    ============================================================ */
    @media (max-width: 600px) {
      .header-badge { display: none; }
      .header-text p { display: none; }
      .chat-window { padding: 1.25rem .85rem .75rem; }
      .input-area  { padding: .5rem .85rem .75rem; }
      .suggestions { padding: .35rem .85rem .5rem; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo" aria-hidden="true">🏥</div>
    <div class="header-text">
      <h1 id="page-title">Hospital Cost Comparer</h1>
      <p id="page-subtitle"></p>
    </div>
    <span class="header-badge" id="header-badge">CMS Medicare Data</span>
  </header>

  <!-- Chat messages -->
  <div class="chat-window" id="chat-window" role="log" aria-live="polite" aria-label="Chat conversation"></div>

  <!-- Suggestions -->
  <div class="suggestions" id="suggestions">
    <div class="suggestions-label">Try asking</div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-box">
      <textarea
        id="user-input"
        rows="1"
        aria-label="Your message"
        autocomplete="off"
        spellcheck="true"
      ></textarea>
      <button id="send-btn" aria-label="Send message" title="Send (Enter)">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M14 8L2 2l2.5 6L2 14l12-6z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <p class="input-hint">Press Enter to send &nbsp;·&nbsp; Shift+Enter for new line &nbsp;·&nbsp; AI responses may contain errors — not medical advice</p>
  </div>

</div>

<script>
  // ============================================================
  // STATE
  // ============================================================
  const history = [];
  let waiting = false;

  // ============================================================
  // INIT
  // ============================================================
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("page-title").textContent    = UI_CONFIG.PAGE_TITLE;
    document.getElementById("page-subtitle").textContent = UI_CONFIG.SUBTITLE;
    document.getElementById("user-input").placeholder    = UI_CONFIG.PLACEHOLDER;
    document.title = UI_CONFIG.PAGE_TITLE;

    buildSuggestions();
    appendMessage("assistant", UI_CONFIG.WELCOME_MSG);

    document.getElementById("user-input").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    document.getElementById("user-input").addEventListener("input", function () {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 140) + "px";
    });

    document.getElementById("send-btn").addEventListener("click", sendMessage);
  });

  // ============================================================
  // SUGGESTIONS
  // ============================================================
  function buildSuggestions() {
    const container = document.getElementById("suggestions");
    UI_CONFIG.SUGGESTIONS.forEach(text => {
      const btn = document.createElement("button");
      btn.className = "suggestion-btn";
      btn.textContent = text;
      btn.addEventListener("click", () => {
        document.getElementById("user-input").value = text;
        sendMessage();
      });
      container.appendChild(btn);
    });
  }

  function hideSuggestions() {
    document.getElementById("suggestions").style.display = "none";
  }

  // ============================================================
  // SEND MESSAGE
  // ============================================================
  async function sendMessage() {
    if (waiting) return;
    const input = document.getElementById("user-input");
    const text  = input.value.trim();
    if (!text) return;

    hideSuggestions();
    input.value = "";
    input.style.height = "auto";

    appendMessage("user", text);
    history.push({ role: "user", content: text });

    const typingId = showTyping();
    setWaiting(true);

    try {
      const res = await fetch(`${BACKEND_URL}/chat`, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({
          message: text,
          history: history.slice(0, -1),
        }),
      });

      const data = await res.json();
      removeTyping(typingId);

      if (!res.ok || data.error) {
        appendMessage("assistant", `⚠️ ${data.error || `Server error ${res.status}`}`, true);
      } else {
        appendMessage("assistant", data.reply);
        history.push({ role: "assistant", content: data.reply });
      }
    } catch (err) {
      removeTyping(typingId);
      appendMessage("assistant", `⚠️ Could not reach the server: ${err.message}`, true);
    }

    setWaiting(false);
    input.focus();
  }

  // ============================================================
  // MARKDOWN RENDERER
  // ============================================================
  function renderMarkdown(text) {
    let t = text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    t = t.replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
      `<pre><code>${code.trim()}</code></pre>`);

    t = t.replace(/^### (.+)$/gm, "<h3>$1</h3>");
    t = t.replace(/^## (.+)$/gm,  "<h2>$1</h2>");
    t = t.replace(/^# (.+)$/gm,   "<h1>$1</h1>");
    t = t.replace(/^[-*_]{3,}$/gm, "<hr>");
    t = t.replace(/^&gt; (.+)$/gm, "<blockquote>$1</blockquote>");

    t = t.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
    t = t.replace(/\*\*(.+?)\*\*/g,     "<strong>$1</strong>");
    t = t.replace(/__(.+?)__/g,          "<strong>$1</strong>");
    t = t.replace(/\*(.+?)\*/g,          "<em>$1</em>");
    t = t.replace(/_(.+?)_/g,            "<em>$1</em>");
    t = t.replace(/`([^`]+)`/g,          "<code>$1</code>");

    t = t.replace(/(?:^|\n)((?:\|.+\|\n?)+)/g, (_, block) => {
      const rows = block.trim().split("\n").filter(r => r.trim());
      if (rows.length < 2) return _;
      const headerCells = rows[0].split("|").filter(c => c.trim() !== "");
      const isSep = rows[1].replace(/[\s|:-]/g, "") === "";
      if (!isSep) return _;
      const header = "<tr>" + headerCells.map(c => `<th>${c.trim()}</th>`).join("") + "</tr>";
      const body = rows.slice(2).map(r => {
        const cells = r.split("|").filter(c => c.trim() !== "");
        return "<tr>" + cells.map(c => `<td>${c.trim()}</td>`).join("") + "</tr>";
      }).join("");
      return `<table><thead>${header}</thead><tbody>${body}</tbody></table>`;
    });

    t = t.replace(/((?:^[*\-] .+\n?)+)/gm, block => {
      const items = block.trim().split("\n")
        .map(l => `<li>${l.replace(/^[*\-] /, "").trim()}</li>`).join("");
      return `<ul>${items}</ul>`;
    });

    t = t.replace(/((?:^\d+\. .+\n?)+)/gm, block => {
      const items = block.trim().split("\n")
        .map(l => `<li>${l.replace(/^\d+\. /, "").trim()}</li>`).join("");
      return `<ol>${items}</ol>`;
    });

    t = t.split(/\n{2,}/).map(block => {
      const b = block.trim();
      if (!b) return "";
      if (/^<(h[1-3]|ul|ol|pre|table|blockquote|hr)/.test(b)) return b;
      return `<p>${b.replace(/\n/g, "<br>")}</p>`;
    }).join("\n");

    return t;
  }

  // ============================================================
  // UI HELPERS
  // ============================================================
  const SEE_MORE_THRESHOLD = 600;

  function appendMessage(role, text, isError = false) {
    const win = document.getElementById("chat-window");

    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    // Avatar
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.textContent = role === "user" ? "U" : "🏥";

    // Bubble wrapper
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    // Bubble
    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");

    if (role === "user" || isError) {
      bubble.textContent = text;
    } else {
      const content = document.createElement("div");
      content.className = "bubble-content";
      content.innerHTML = renderMarkdown(text);
      bubble.appendChild(content);

      if (text.length > SEE_MORE_THRESHOLD) {
        content.classList.add("collapsed");
        const btn = document.createElement("button");
        btn.className = "see-more-btn";
        btn.innerHTML = `<span>▾</span> See more`;
        btn.addEventListener("click", () => {
          const collapsed = content.classList.toggle("collapsed");
          btn.innerHTML = collapsed ? `<span>▾</span> See more` : `<span>▴</span> See less`;
          if (!collapsed) scrollToBottom();
        });
        wrap.appendChild(bubble);
        wrap.appendChild(btn);
        msg.appendChild(avatar);
        msg.appendChild(wrap);
        win.appendChild(msg);
        scrollToBottom();
        return msg;
      }
    }

    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    win.appendChild(msg);
    scrollToBottom();
    return msg;
  }

  function showTyping() {
    const id  = "typing-" + Date.now();
    const win = document.getElementById("chat-window");

    const msg = document.createElement("div");
    msg.className = "message assistant typing";
    msg.id = id;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.setAttribute("aria-hidden", "true");
    avatar.textContent = "🏥";

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.setAttribute("aria-label", "Assistant is typing");
    [1,2,3].forEach(() => {
      const dot = document.createElement("span");
      dot.className = "dot";
      bubble.appendChild(dot);
    });

    wrap.appendChild(bubble);
    msg.appendChild(avatar);
    msg.appendChild(wrap);
    win.appendChild(msg);
    scrollToBottom();
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function setWaiting(state) {
    waiting = state;
    document.getElementById("send-btn").disabled    = state;
    document.getElementById("user-input").disabled  = state;
  }

  // ============================================================
  // SCROLL HELPER
  // ============================================================
  function scrollToBottom() {
    const w = document.getElementById("chat-window");
    w.scrollTop = w.scrollHeight;
  }
</script>
</body>
</html>
