<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crossy Road</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a2e;
      overflow: hidden;
      font-family: 'Arial Rounded MT Bold', 'Arial', sans-serif;
    }

    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #score-display {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
      letter-spacing: 2px;
    }

    /* Start Screen */
    #start-screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.55);
      z-index: 20;
    }

    #start-screen h1 {
      color: #fff;
      font-size: 64px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.7);
      margin-bottom: 12px;
      letter-spacing: 3px;
    }

    #start-screen .subtitle {
      color: #ffd700;
      font-size: 22px;
      margin-bottom: 48px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    .btn {
      background: #ffd700;
      color: #333;
      border: none;
      border-radius: 50px;
      padding: 18px 56px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #b8960c, 0 8px 20px rgba(0,0,0,0.4);
      transition: transform 0.1s, box-shadow 0.1s;
      pointer-events: all;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #b8960c, 0 10px 24px rgba(0,0,0,0.4);
    }

    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #b8960c, 0 5px 14px rgba(0,0,0,0.4);
    }

    /* Game Over Screen */
    #gameover-screen {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      z-index: 20;
    }

    #gameover-screen h2 {
      color: #ff4444;
      font-size: 72px;
      text-shadow: 0 4px 16px rgba(0,0,0,0.8);
      margin-bottom: 16px;
    }

    #final-score {
      color: #fff;
      font-size: 32px;
      margin-bottom: 10px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    #best-score {
      color: #ffd700;
      font-size: 24px;
      margin-bottom: 48px;
      text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* Controls hint */
    #controls-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 16px;
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }

    .key {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 14px;
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <canvas id="game-canvas"></canvas>

  <div id="score-display">0</div>

  <!-- Start Screen -->
  <div id="start-screen">
    <h1>🐔 CROSSY ROAD</h1>
    <p class="subtitle">How far can you go?</p>
    <button class="btn" id="start-btn">PLAY</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameover-screen" id="gameover-screen">
    <h2>GAME OVER</h2>
    <div id="final-score">Score: 0</div>
    <div id="best-score">Best: 0</div>
    <button class="btn" id="restart-btn">PLAY AGAIN</button>
  </div>

  <!-- Controls hint (shown during gameplay) -->
  <div id="controls-hint" style="display:none;">
    <span class="key">↑</span> Forward &nbsp;
    <span class="key">↓</span> Back &nbsp;
    <span class="key">←</span> Left &nbsp;
    <span class="key">→</span> Right &nbsp;&nbsp;|&nbsp;&nbsp;
    <span class="key">P</span> Pause
  </div>

  <!-- Pause Screen -->
  <div id="pause-screen" style="display:none; position:fixed; inset:0; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.55); z-index:20;">
    <h2 style="color:#fff; font-family:'Arial Rounded MT Bold',Arial,sans-serif; font-size:60px; text-shadow:0 4px 12px rgba(0,0,0,0.7); margin-bottom:16px;">PAUSED</h2>
    <p style="color:#ffd700; font-family:'Arial Rounded MT Bold',Arial,sans-serif; font-size:22px; text-shadow:0 2px 6px rgba(0,0,0,0.5);">Press <strong>P</strong> to resume</p>
  </div>

  <!-- Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
