<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gong Chat helps you find your next favorite bubble tea drink.">
  <title>Gong Chat | Find Your Drink</title>
  <style>
    :root {
      --milk-tea: #d6ad82;
      --milk-tea-light: #e8c79e;
      --milk-tea-dark: #a66d49;
      --boba: #35201c;
      --boba-soft: #684037;
      --cream: #fff7e9;
      --red: #d83232;
      --green: #748c54;
      --ink: #2b1a18;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--milk-tea); }
    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 247, 233, .5) 0 6px, transparent 7px),
        radial-gradient(circle at 84% 11%, rgba(255, 247, 233, .35) 0 4px, transparent 5px),
        radial-gradient(circle at 72% 80%, rgba(125, 74, 46, .1) 0 8px, transparent 9px),
        linear-gradient(135deg, var(--milk-tea-light), var(--milk-tea) 46%, #c99469);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      width: 260px;
      height: 260px;
      border: 1px solid rgba(255, 247, 233, .28);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }
    body::before { top: -125px; right: -65px; }
    body::after { bottom: -150px; left: -80px; width: 310px; height: 310px; }

    .home {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 54px 28px 42px;
      isolation: isolate;
    }

    .home-inner {
      position: relative;
      width: min(1120px, 100%);
      min-height: min(720px, calc(100vh - 96px));
      display: grid;
      place-items: center;
      padding: 48px 24px 62px;
      border: 2px solid rgba(255, 247, 233, .45);
      border-radius: 44px;
      background: rgba(239, 207, 165, .22);
      box-shadow: 0 28px 60px rgba(91, 53, 33, .16), inset 0 1px rgba(255, 247, 233, .28);
    }

    .brand {
      position: absolute;
      top: 25px;
      left: 30px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--boba);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border: 2px solid var(--boba);
      border-radius: 50%;
      font-size: 16px;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .hero-copy {
      position: relative;
      z-index: 4;
      width: min(650px, 100%);
      margin-top: 10px;
      text-align: center;
    }
    .kicker {
      margin: 0 0 10px;
      color: var(--boba-soft);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .04em;
      margin: 0;
      color: var(--boba);
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", ui-rounded, sans-serif;
      font-size: clamp(60px, 11vw, 126px);
      font-weight: 950;
      letter-spacing: -.085em;
      line-height: .88;
      text-shadow: 0 6px 0 #241512, 0 10px 18px rgba(82, 42, 27, .25);
      user-select: none;
    }
    .letter {
      display: inline-block;
      position: relative;
      transform: translate3d(0, 0, 0) rotate(var(--rotation));
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
      will-change: transform;
    }
    .letter::before {
      position: absolute;
      top: 13%;
      left: 18%;
      width: 15%;
      height: 8%;
      border-radius: 50%;
      background: rgba(255, 247, 233, .68);
      content: "";
      filter: blur(.4px);
      transform: rotate(-24deg);
    }
    .letter:nth-child(2n)::before { top: 20%; left: 24%; width: 10%; height: 6%; }
    .letter.space { width: .2em; }
    .subtitle {
      max-width: 470px;
      margin: 25px auto 25px;
      color: #583b2c;
      font-size: clamp(15px, 2vw, 18px);
      line-height: 1.55;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      border: 0;
      border-radius: 999px;
      padding: 15px 24px 15px 27px;
      color: var(--cream);
      background: var(--red);
      box-shadow: 0 6px 0 #9e2828, 0 13px 20px rgba(116, 45, 35, .2);
      font: inherit;
      font-weight: 850;
      text-decoration: none;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .cta::after { content: "→"; font-size: 22px; line-height: 0; }
    .cta:hover, .cta:focus-visible { background: #bf262b; outline: none; transform: translateY(-3px); box-shadow: 0 9px 0 #9e2828, 0 15px 22px rgba(116, 45, 35, .2); }
    .cta:active { transform: translateY(2px); box-shadow: 0 3px 0 #9e2828; }

    .drinks-stage {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }
    .drink {
      position: absolute;
      width: 150px;
      height: 245px;
      display: grid;
      place-items: end center;
      pointer-events: auto;
      transform: rotate(var(--tilt));
      transition: filter .25s ease;
    }
    .drink:hover, .drink:focus-visible { z-index: 5; filter: drop-shadow(0 15px 10px rgba(82, 42, 27, .2)); animation: drink-shake .6s ease-in-out infinite; outline: none; }
    .drink-a { --tilt: -10deg; top: 25%; left: 4%; }
    .drink-b { --tilt: 8deg; right: 4%; bottom: 15%; }
    .drink-c { --tilt: -5deg; right: 13%; top: 8%; transform: scale(.82) rotate(var(--tilt)); }
    .drink-shadow { position: absolute; bottom: 4px; width: 105px; height: 18px; border-radius: 50%; background: rgba(85, 44, 29, .23); filter: blur(4px); }
    .straw { position: absolute; z-index: 0; top: 0; width: 10px; height: 111px; border-radius: 9px; background: var(--boba); transform: rotate(7deg); transform-origin: bottom center; }
    .drink-b .straw { background: #7d4932; transform: rotate(-7deg); }
    .drink-c .straw { background: var(--green); }
    .cup {
      position: relative;
      z-index: 1;
      width: 116px;
      height: 160px;
      overflow: visible;
      border: 3px solid rgba(75, 42, 31, .83);
      border-top: 0;
      border-radius: 8px 8px 30px 30px;
      background: var(--drink-color);
      box-shadow: inset 10px 0 rgba(255, 255, 255, .22), inset -8px 0 rgba(109, 51, 33, .12);
    }
    .cup::before {
      position: absolute;
      z-index: 2;
      top: -14px;
      left: -8px;
      width: 126px;
      height: 24px;
      border: 3px solid rgba(75, 42, 31, .85);
      border-radius: 50%;
      background: var(--lid-color);
      box-shadow: inset 0 5px rgba(255, 255, 255, .28);
      content: "";
    }
    .cup::after {
      position: absolute;
      right: 11px;
      bottom: 13px;
      left: 11px;
      height: 43px;
      border-radius: 0 0 20px 20px;
      background: radial-gradient(circle at 13px 11px, var(--boba) 0 6px, transparent 7px), radial-gradient(circle at 39px 25px, var(--boba) 0 6px, transparent 7px), radial-gradient(circle at 67px 10px, var(--boba) 0 6px, transparent 7px), radial-gradient(circle at 91px 29px, var(--boba) 0 6px, transparent 7px), radial-gradient(circle at 51px 38px, var(--boba) 0 5px, transparent 6px);
      content: "";
    }
    .cream {
      position: absolute;
      z-index: 3;
      top: -26px;
      left: 7px;
      width: 100px;
      height: 36px;
      border-radius: 46% 54% 38% 35%;
      background: var(--cream-color);
      box-shadow: 7px 6px rgba(135, 74, 51, .12), inset 7px 5px rgba(255, 255, 255, .45);
    }
    .cream::after { position: absolute; right: 12px; bottom: -4px; width: 27px; height: 12px; border-radius: 50%; background: var(--cream-color); content: ""; }
    .cup-label { position: absolute; z-index: 3; top: 48px; left: 22px; width: 68px; padding: 7px 3px; border: 2px solid rgba(75, 42, 31, .28); border-radius: 9px; color: rgba(75, 42, 31, .7); font-size: 9px; font-weight: 900; letter-spacing: .1em; text-align: center; text-transform: uppercase; }
    .drink-a { --drink-color: #d99d72; --lid-color: #f4d7b1; --cream-color: #fff1d3; }
    .drink-b { --drink-color: #e79b9b; --lid-color: #ffd5d2; --cream-color: #fff2df; }
    .drink-c { --drink-color: #9fb37b; --lid-color: #d5e3b8; --cream-color: #f8f0d8; }

    .hint {
      position: absolute;
      right: 29px;
      bottom: 25px;
      margin: 0;
      color: rgba(67, 40, 29, .7);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .bubble {
      position: absolute;
      z-index: -1;
      width: var(--size);
      height: var(--size);
      border: 2px solid rgba(255, 247, 233, .28);
      border-radius: 50%;
      animation: float var(--speed) ease-in-out infinite alternate;
    }
    .bubble-one { top: 15%; left: 32%; --size: 18px; --speed: 3s; }
    .bubble-two { top: 33%; right: 26%; --size: 11px; --speed: 2.4s; }
    .bubble-three { bottom: 24%; left: 21%; --size: 26px; --speed: 3.6s; }

    @keyframes drink-shake {
      0%, 100% { transform: translateY(0) rotate(calc(var(--tilt) - 2deg)); }
      25% { transform: translateY(-3px) rotate(calc(var(--tilt) + 4deg)); }
      50% { transform: translateY(1px) rotate(calc(var(--tilt) - 4deg)); }
      75% { transform: translateY(-2px) rotate(calc(var(--tilt) + 2deg)); }
    }
    @keyframes float { from { transform: translateY(-5px); } to { transform: translateY(8px); } }

    @media (max-width: 850px) {
      .home { padding: 20px 14px; }
      .home-inner { min-height: calc(100vh - 40px); padding-top: 135px; padding-bottom: 150px; overflow: hidden; }
      .drink-a { top: 9%; left: -21px; transform: scale(.67) rotate(var(--tilt)); }
      .drink-b { right: -28px; bottom: 10%; transform: scale(.7) rotate(var(--tilt)); }
      .drink-c { top: auto; right: 27%; bottom: 4%; transform: scale(.57) rotate(var(--tilt)); }
      .hint { right: 0; bottom: 18px; left: 0; text-align: center; }
    }
    @media (max-width: 520px) {
      .home-inner { border-radius: 28px; padding-right: 17px; padding-left: 17px; }
      .brand { top: 19px; left: 20px; }
      h1 { font-size: clamp(52px, 17vw, 82px); }
      .subtitle { margin-top: 21px; font-size: 14px; }
      .drink-a { top: 12%; left: -48px; }
      .drink-b { right: -49px; bottom: 14%; }
      .drink-c { right: 20%; bottom: 3%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="home">
    <div class="home-inner">
      <div class="brand"><span class="brand-mark">g</span><span>gong cha</span></div>
      <div class="bubble bubble-one" aria-hidden="true"></div>
      <div class="bubble bubble-two" aria-hidden="true"></div>
      <div class="bubble bubble-three" aria-hidden="true"></div>

      <section class="hero-copy" aria-labelledby="page-title">
        <p class="kicker">A little help for your next sip</p>
        <h1 id="page-title" aria-label="Gong Chat">
          <span class="letter" data-depth="1.15" style="--rotation:-4deg">G</span>
          <span class="letter" data-depth=".8" style="--rotation:2deg">o</span>
          <span class="letter" data-depth="1.1" style="--rotation:4deg">n</span>
          <span class="letter" data-depth=".9" style="--rotation:-2deg">g</span>
          <span class="letter space" aria-hidden="true"></span>
          <span class="letter" data-depth=".9" style="--rotation:3deg">C</span>
          <span class="letter" data-depth="1.15" style="--rotation:-3deg">h</span>
          <span class="letter" data-depth=".8" style="--rotation:4deg">a</span>
          <span class="letter" data-depth="1" style="--rotation:-1deg">t</span>
        </h1>
        <p class="subtitle">Answer a few quick questions and discover the Gong cha drink that matches your mood, flavor cravings, and favorite toppings.</p>
        <a class="cta" href="chat.html">Find my drink</a>
      </section>

      <div class="drinks-stage" aria-label="Illustrated bubble tea drinks">
        <div class="drink drink-a" tabindex="0" aria-label="Milk tea with pearls illustration">
          <div class="drink-shadow"></div><div class="straw"></div>
          <div class="cup"><div class="cream"></div><div class="cup-label">milk tea</div></div>
        </div>
        <div class="drink drink-b" tabindex="0" aria-label="Strawberry bubble tea illustration">
          <div class="drink-shadow"></div><div class="straw"></div>
          <div class="cup"><div class="cream"></div><div class="cup-label">strawberry</div></div>
        </div>
        <div class="drink drink-c" tabindex="0" aria-label="Matcha bubble tea illustration">
          <div class="drink-shadow"></div><div class="straw"></div>
          <div class="cup"><div class="cream"></div><div class="cup-label">matcha</div></div>
        </div>
      </div>
      <p class="hint">Move your cursor · shake a drink</p>
    </div>
  </main>

  <script>
    const title = document.getElementById("page-title");
    const letters = [...document.querySelectorAll(".letter[data-depth]")];
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (!reducedMotion) {
      title.addEventListener("pointermove", (event) => {
        const bounds = title.getBoundingClientRect();
        const x = (event.clientX - (bounds.left + bounds.width / 2)) / bounds.width;
        const y = (event.clientY - (bounds.top + bounds.height / 2)) / bounds.height;
        letters.forEach((letter) => {
          const depth = Number(letter.dataset.depth);
          letter.style.transform = `translate3d(${x * depth * 22}px, ${y * depth * 18}px, 0) rotate(${getComputedStyle(letter).getPropertyValue("--rotation")})`;
        });
      });
      title.addEventListener("pointerleave", () => {
        letters.forEach((letter) => { letter.style.transform = ""; });
      });
    }
  </script>
</body>
</html>
