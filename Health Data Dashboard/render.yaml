# ============================================================
# Render Deployment Configuration
# ============================================================
# This file tells Render how to build and run the Flask backend.
#
# Steps to deploy:
#   1. Push this repo to GitHub
#   2. Go to https://render.com and create a free account
#   3. Click "New" -> "Web Service" -> connect your GitHub repo
#   4. Render will auto-detect this file and fill in the settings
#   5. Click "Deploy" -- Render gives you a URL like:
#        https://health-data-dashboard-xxxx.onrender.com
#   6. Paste that URL into BACKEND_URL in index.html
#
# WHO and OWID are public sources; chat uses OPENAI_API_KEY configured in
# Render's environment and never stored in this repository.
# ============================================================

services:
  - type: web
    name: health-data-dashboard
    runtime: python
    rootDir: Health Data Dashboard     # folder containing app.py
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false             # set this secret in the Render dashboard
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RENDER
        value: "true"            # tells app.py it's running on Render (disables debug)
    plan: free
